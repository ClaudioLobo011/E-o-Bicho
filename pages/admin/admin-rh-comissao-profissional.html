<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Comissão por Profissional</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../src/output.css">
  <link rel="stylesheet" href="../../src/commission-professional.css">
</head>
<body class="bg-gray-100">
  <div id="admin-header-placeholder"></div>


  <main class="commission-page">
    <div id="admin-sidebar-placeholder"></div>
    <header class="commission-heading"><div><p class="commission-eyebrow">RECURSOS HUMANOS / COMISSÕES</p><h1>Comissão por profissional</h1></div><span id="commission-selected-badge" class="commission-badge">Selecione um profissional</span></header>
    <div id="commission-feedback" role="status" aria-live="polite"></div>
    <div class="commission-workspace">
      <aside class="commission-panel commission-people"><h2>Profissionais</h2><label for="commission-professional-search">Buscar profissional</label><input id="commission-professional-search" type="search" placeholder="Nome ou cargo"><p id="commission-professionals-counter" class="commission-muted"></p><div id="commission-professionals-list"></div></aside>
      <section class="commission-panel commission-main">
        <div class="commission-toolbar"><div><h2 id="commission-professional-name">Configuração do profissional</h2><span id="commission-role-badge" class="commission-muted"></span></div><div class="commission-save"><span id="commission-dirty" aria-live="polite"></span><button id="commission-save-btn" type="button" class="commission-primary" disabled>Salvar configuração</button></div></div>
        <p id="commission-selection-placeholder">Nenhum profissional selecionado.</p>
        <div id="commission-editor" hidden>
          <div class="commission-effective"><label>Aplicar alterações a partir de<input id="commission-effective-from" type="date" required></label></div>
          <div class="commission-tabs" role="tablist" aria-label="Configuração de comissões"><button type="button" role="tab" id="commission-tab-general" aria-controls="commission-general" aria-selected="true">Regras gerais</button><button type="button" role="tab" id="commission-tab-weekdays" aria-controls="commission-weekdays" aria-selected="false">Dias da semana <span id="commission-weekday-count">0</span></button></div>
          <section id="commission-general" role="tabpanel" aria-labelledby="commission-tab-general"><div class="commission-section-title"><div><h3>Comissão por grupo de serviço</h3></div><input type="search" id="commission-group-search" placeholder="Filtrar grupos" aria-label="Filtrar grupos"></div><div id="commission-groups-body" class="commission-rule-list"></div><div class="commission-section-title"><div><h3>Comissão por serviço</h3></div><input id="commission-service-search" type="search" placeholder="Filtrar serviços" aria-label="Filtrar serviços"></div><div id="commission-services-body" class="commission-rule-list"></div></section>
          <section id="commission-weekdays" role="tabpanel" aria-labelledby="commission-tab-weekdays" hidden><div class="commission-section-title"><div><h3>Dias com comissão especial</h3></div><button id="commission-add-weekday" type="button" class="commission-primary">+ Adicionar regra</button></div><div id="commission-weekday-rules"></div></section>
        </div>
      </section>
    </div>
  </main>

  <div id="modal-placeholder"></div>
  <div id="confirm-modal-placeholder"></div>
  <div id="admin-footer-placeholder"></div>

  <script>var basePath = '../../';</script>
  <script src="../../scripts/core/config.js?v=20260812-2"></script>
  <script src="../../scripts/core/ui.js"></script>
  <script src="../../scripts/core/main.js"></script>
  <script src="../../scripts/admin/admin.js"></script>
  <script src="../../scripts/common/professional-commission-engine.js"></script>
  <script src="../../scripts/admin/admin-rh-comissao-profissional.js"></script>
  <script src="/scripts/common/modal-bridge.js"></script>
</body>
</html>
