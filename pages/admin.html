<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Painel de Administração - E o Bicho</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../src/output.css">
  <link rel="stylesheet" href="../src/responsive-workspace.css?v=20261008-1">
  <link rel="stylesheet" href="../src/admin-v2.css?v=20261121-2">
</head>
<body class="bg-gray-100 responsive-site responsive-workspace admin-v2">

    <div id="admin-header-placeholder"></div>

    <main class="container mx-auto px-4 pt-1 pb-8 min-h-screen">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">

            <aside class="md:col-span-4">
                <div id="admin-sidebar-placeholder"></div>
            </aside>

            <div class="md:col-span-4">
                <section class="admin-home">
                    <h1 data-admin-v2-title>Painel Principal</h1>

                    <section class="admin-home-section" aria-labelledby="admin-home-operations">
                        <h2 id="admin-home-operations">Operação da loja</h2>
                        <div class="admin-home-grid">
                            <a href="admin/admin-produtos.html" class="admin-home-card">
                                <i class="fas fa-box-open" aria-hidden="true"></i>
                                <span><strong>Gerir Produtos</strong><small>Adicionar e editar produtos</small></span>
                            </a>
                            <a href="admin/admin-pedidos-web.html" class="admin-home-card">
                                <i class="fas fa-receipt" aria-hidden="true"></i>
                                <span><strong>Ver Pedidos</strong><small>Acompanhar pedidos da loja online</small></span>
                            </a>
                            <a href="admin/admin-crm.html" class="admin-home-card">
                                <i class="fas fa-users" aria-hidden="true"></i>
                                <span><strong>CRM</strong><small>Comunicação com clientes</small></span>
                            </a>
                        </div>
                    </section>

                    <section class="admin-home-section" aria-labelledby="admin-home-downloads">
                        <h2 id="admin-home-downloads">Aplicativos e suporte</h2>
                        <div class="admin-home-grid">
                            <a href="/public/downloads/eobicho-funcionarios-v1.0.1.apk" download class="admin-home-card">
                                <i class="fas fa-mobile-screen-button" aria-hidden="true"></i>
                                <span><strong>Aplicativo Mobile</strong><small>Baixar APK</small></span>
                            </a>
                            <a href="https://github.com/ClaudioLobo011/E-o-Bicho/releases/download/installer-1.0.2/E-o-Bicho-1.0.2-Instalador.exe" class="admin-home-card">
                                <i class="fas fa-desktop" aria-hidden="true"></i>
                                <span><strong>PDV e Agenda Desktop</strong><small>Instalador Windows v1.0.2 (.exe)</small></span>
                            </a>
                            <button type="button" id="download-aspia" class="admin-home-card">
                                <i class="fas fa-headset" aria-hidden="true"></i>
                                <span><strong>Aspia</strong><small>Host de suporte Windows (.zip). Extraia e execute INSTALAR-ASPIA-EOBICHO.cmd</small></span>
                            </button>
                        </div>
                        <p id="download-aspia-status" role="status" aria-live="polite" class="mt-2 text-sm"></p>
                    </section>
                </section>
            </div>

        </div>
    </main>

    <div id="modal-placeholder"></div>
    <div id="confirm-modal-placeholder"></div>

    <div id="admin-footer-placeholder"></div>
    
    <script>var basePath = '../';</script>
    <script src="../scripts/core/config.js?v=20260812-2"></script>
    <script src="../scripts/core/ui.js"></script>
    <script src="../scripts/core/main.js?v=20261121-2"></script>
    <script src="../scripts/admin/admin.js"></script>
    <script src="../scripts/admin/admin-aspia-download.js?v=20261124-3"></script>
  <script src="../scripts/common/responsive-workspace.js?v=20261121-2"></script>
</body>
</html>
